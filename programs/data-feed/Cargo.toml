[package]
name = "data-feed"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "data_feed"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []

[dependencies]
anchor-lang = "0.32.1"
switchboard-on-demand = "0.11.3"
access-control = { path = "../access-control", features = ["no-entrypoint"] }
pyth-solana-receiver-sdk = "1.1.0"
chainlink_solana = "2.0.8"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
